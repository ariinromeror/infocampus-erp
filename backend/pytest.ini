[pytest]
asyncio_mode = strict
; pytest-asyncio 0.24 no permite configurar el scope del loop de los TESTS por
; ini (solo el de fixtures), y cada test async corre en su propio loop nuevo
; (function scope). Si un fixture async vive en un scope mayor (session/module)
; sus objetos asyncpg quedan atados a un loop distinto al del test → error
; "attached to a different loop". Por eso aquí todo queda en "function".
asyncio_default_fixture_loop_scope = function
testpaths = tests
