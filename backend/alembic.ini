[alembic]
# RQ-03 (docs/PRD.md): configuración de Alembic para versionar el esquema de
# PostgreSQL. `sqlalchemy.url` se sobreescribe en tiempo de ejecución desde
# `DATABASE_URL` (ver alembic/env.py) — el valor de aquí abajo es solo un
# placeholder para que `alembic` funcione si se invoca sin variables de
# entorno cargadas (falla con un mensaje claro en vez de un traceback).
script_location = %(here)s/alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

# Formato de los nombres de archivo de cada revisión: 0001_slug.py, 0002_slug.py...
file_template = %%(rev)s_%%(slug)s

# Zona horaria usada para los timestamps embebidos en cada migración generada.
timezone = UTC

# Máxima longitud de caracteres para el "slug" derivado del mensaje de revisión.
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
